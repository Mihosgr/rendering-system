<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Νέα Καταχώρηση Batch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Rendering System - Πτηνοσφαγείο</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Φόρμα Καταχώρησης Νέου Batch</h5>
                </div>
                <div class="card-body">
                    <!-- Η φόρμα στέλνει τα δεδομένα στο /batch/save μέσω POST -->
                    <form th:action="@{/batch/save}" th:object="${batch}" method="post">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Είδος Προϊόντος</label>
                                <select class="form-select" th:field="*{productType}">
                                    <option value="OFFAL_MEAL">Πτηνάλευρο (Offal Meal)</option>
                                    <option value="FEATHER_MEAL">Πτεράλευρο (Feather Meal)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Α/Α (Αριθμός Batch)</label>
                                <input type="number" class="form-control" th:field="*{batchNumber}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Φόρτωση Μαλακών/Φτερών (kg)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{rawMaterialWeight}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Λάδι Προσθήκης (kg)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{addedOilWeight}">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Ζύγιση Τελικού Άλευρου (kg)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{finalMealWeight}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Τελικό Λάδι Παραγωγής (kg)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{finalOilWeight}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <a href="/" class="btn btn-secondary me-2">Ακύρωση</a>
                            <button type="submit" class="btn btn-primary">Αποθήκευση & Υπολογισμός</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
