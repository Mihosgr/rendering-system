<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Διαχείριση Χρήστη</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { background-color: #121212; color: #e0e0e0; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 600px;">
    <div class="card bg-dark border-secondary shadow-sm">
        <div class="card-header border-secondary bg-transparent py-3">
            <h4 class="mb-0 text-info" th:text="${user.id == null ? 'Νέος Χρήστης' : 'Επεξεργασία Χρήστη'}"></h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/users/save}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label text-muted">Username (Μοναδικό)</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" th:field="*{username}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Ονοματεπώνυμο</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" th:field="*{fullName}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Ρόλος Συστήματος</label>
                    <select class="form-select bg-dark text-light border-secondary" th:field="*{role}" required>
                        <option th:each="entry : ${roles}" th:value="${entry.key}" th:text="${entry.value}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Κωδικός Πρόσβασης</label>
                    <input type="password" class="form-control bg-dark text-light border-secondary" th:field="*{password}" th:required="${user.id == null}">
                    <div class="form-text text-secondary" th:if="${user.id != null}">
                        Αφήστε το κενό εάν δεν θέλετε να αλλάξετε τον κωδικό.
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/users}" class="btn btn-outline-secondary">Ακύρωση</a>
                    <button type="submit" class="btn btn-success fw-bold"><i class="bi bi-save"></i> Αποθήκευση</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
