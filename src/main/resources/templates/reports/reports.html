<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αναφορές Παραγωγής</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .filter-card { background-color: #1a1a1a; border: 1px solid #2d2d2d; }
        .table-custom-header { background-color: #1a252f; color: #5dade2; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0 text-info"><i class="bi bi-file-earmark-bar-graph me-2"></i>Αναφορές Παραγωγής</h3>
        <a th:href="@{/reports/export(startDate=${startDate}, endDate=${endDate})}" class="btn btn-success fw-bold">
            <i class="bi bi-file-earmark-excel me-1"></i>Εξαγωγή σε Excel
        </a>
    </div>

    <!-- Φόρμα Φίλτρων Ημερομηνίας -->
    <div class="card filter-card p-3 mb-4 shadow-sm">
        <form th:action="@{/reports}" method="get" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label text-muted fw-bold small">Από Ημερομηνία</label>
                <input type="date" class="form-control bg-dark text-light border-secondary" name="startDate" th:value="${startDate}">
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted fw-bold small">Έως Ημερομηνία</label>
                <input type="date" class="form-control bg-dark text-light border-secondary" name="endDate" th:value="${endDate}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-info text-dark fw-bold w-100">
                    <i class="bi bi-filter me-1"></i>Εφαρμογή Φίλτρων
                </button>
                <a th:href="@{/reports}" class="btn btn-outline-secondary w-100">Επαναφορά</a>
            </div>
        </form>
    </div>

    <!-- Πίνακας Αναφοράς -->
    <div class="card bg-dark border-secondary shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-dark table-hover mb-0 text-center align-middle border-secondary" style="font-size: 0.95rem;">
                <!-- Γραμμή 1: Περίοδος Αναφοράς -->
                <thead>
                <tr class="table-custom-header">
                    <th colspan="6" class="py-3 fs-6 fw-bold text-uppercase border-secondary">
                        ΠΕΡΙΟΔΟΣ ΑΝΑΦΟΡΑΣ:
                        <span th:text="${#temporals.format(startDate, 'dd/MM/yyyy')}"></span>
                        ΕΩΣ
                        <span th:text="${#temporals.format(endDate, 'dd/MM/yyyy')}"></span>
                    </th>
                </tr>
                <!-- Γραμμή 2: Ονόματα Στηλών -->
                <tr class="text-uppercase small border-secondary">
                    <th>Ημερομηνία</th>
                    <th>Μαλακοί ιστοί</th>
                    <th>Πτηνάλευρο</th>
                    <th>Πτηνέλαιο</th>
                    <th>Πούπουλα</th>
                    <th>Πτεράλευρο</th>
                </tr>
                <!-- Γραμμή 3: Βιομηχανικοί Κωδικοί -->
                <tr class="text-muted border-secondary font-monospace small">
                    <th>-</th>
                    <th>07-99-12</th>
                    <th>80-00-01</th>
                    <th>80-00-02</th>
                    <th>07-99-11</th>
                    <th>80-00-03</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${reportData}">
                    <td class="fw-bold text-light" th:text="${#temporals.format(row.date, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#numbers.formatDecimal(row.softTissueWeight, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(row.offalMealWeight, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(row.oilWeight, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(row.feathersWeight, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(row.featherMealWeight, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(reportData)}">
                    <td colspan="6" class="text-muted py-5">Δεν βρέθηκαν δεδομένα παραγωγής για την επιλεγμένη περίοδο.</td>
                </tr>
                </tbody>
                <!-- Γραμμή Συναθροίσεων (Σύνολα) -->
                <tfoot th:if="${not #lists.isEmpty(reportData)}" class="table-group-divider border-secondary fw-bold text-info fs-6">
                <tr>
                    <td>ΣΥΝΟΛΑ</td>
                    <td th:text="${#numbers.formatDecimal(totalSoft, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(totalOffal, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(totalOil, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(totalFeathers, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                    <td th:text="${#numbers.formatDecimal(totalFeatherMeal, 1, 'COMMA', 0, 'POINT')} + ' kg'"></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
