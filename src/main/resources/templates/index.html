<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Rendering Dashboard</title>
    <!-- Εισαγωγή Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Rendering System - Πτηνοσφαγείο</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Κεντρικός Πίνακας Ελέγχου</h5>
                </div>
                <div class="card-body">
                    <p class="lead">Καλώς ήρθατε στο σύστημα παρακολούθησης παραγωγής και αποθήκης (Offal / Feather Meal).</p>
                    <hr>
                    <button class="btn btn-success me-2">Νέα Καταχώρηση Batch</button>
                    <button class="btn btn-outline-secondary">Προβολή Αποθέματος</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Εισαγωγή Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
