<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Rendering Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Rendering System - Πτηνοσφαγείο</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Ημερήσια Παραγωγή - Batches</h5>
                    <button class="btn btn-sm btn-light">Νέο Batch</button>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Α/Α</th>
                            <th>Προϊόν</th>
                            <th>Φόρτωση</th>
                            <th>Τέλος Μαγ.</th>
                            <th>Μαλακά (kg)</th>
                            <th>Λάδι Προσθ. (kg)</th>
                            <th>Άλευρο (kg)</th>
                            <th>Τελικό Λάδι (kg)</th>
                            <th>Απόδοση (%)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Επανάληψη (loop) για κάθε batch -->
                        <tr th:each="batch : ${batches}">
                            <td th:text="${batch.batchNumber}">1</td>
                            <td>
                                <span th:if="${batch.productType.name() == 'OFFAL_MEAL'}" class="badge bg-warning text-dark">Πτηνάλευρο</span>
                                <span th:if="${batch.productType.name() == 'FEATHER_MEAL'}" class="badge bg-secondary">Πτεράλευρο</span>
                            </td>
                            <td th:text="${batch.loadTime}">08:00</td>
                            <td th:text="${batch.cookEndTime}">12:00</td>
                            <td th:text="${batch.rawMaterialWeight}">0</td>
                            <td th:text="${batch.addedOilWeight}">0</td>
                            <td th:text="${batch.finalMealWeight}">0</td>
                            <td th:text="${batch.finalOilWeight}">0</td>
                            <td>
                                <strong th:text="${batch.yieldPercentage} + '%'" class="text-success">0%</strong>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(batches)}">
                            <td colspan="9" class="text-center py-4 text-muted">Δεν βρέθηκαν καταχωρήσεις για σήμερα.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
