<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Δρομολόγια & Προετοιμασία</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .table-dark-custom { background-color: #1e1e1e; }
        .text-monospace { font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0"><i class="bi bi-truck text-success me-2"></i> Διαχείριση Δρομολογίων</h3>

        <!-- Φόρμα για δημιουργία νέου Δρομολογίου -->
        <form th:action="@{/shipments/create}" method="post">
            <button type="submit" class="btn btn-primary fw-bold">
                <i class="bi bi-folder-plus"></i> Νέος Φάκελος Προετοιμασίας
            </button>
        </form>
    </div>

    <!-- Πίνακας Ενεργών Δρομολογίων -->
    <div class="card bg-transparent border-0 shadow-sm">
        <div class="card-body p-0 rounded overflow-hidden border border-secondary">
            <table class="table table-dark table-hover mb-0 align-middle text-center">
                <thead class="table-dark-custom text-uppercase small text-muted">
                <tr>
                    <th>Κωδικός Φακέλου</th>
                    <th>Ημερομηνία Δημιουργίας</th>
                    <th>Σάκοι</th>
                    <th>Κατάσταση</th>
                    <th>Ενέργειες</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="shipment : ${activeShipments}">
                    <td><strong class="text-info text-monospace fs-5" th:text="${shipment.shipmentCode}"></strong></td>
                    <td th:text="${#temporals.format(shipment.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge bg-secondary fs-6" th:text="${#lists.size(shipment.bags)}"></span></td>
                    <td><span class="badge bg-warning text-dark"><i class="bi bi-gear-wide-connected"></i> Προετοιμασία</span></td>
                    <td>
                        <a th:href="@{'/shipments/' + ${shipment.id}}" class="btn btn-sm btn-outline-info">
                            <i class="bi bi-folder2-open"></i> Άνοιγμα Ελέγχου
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(activeShipments)}">
                    <td colspan="5" class="text-muted py-5 text-center">Δεν υπάρχουν ανοιχτοί φάκελοι δρομολογίων αυτή τη στιγμή.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
