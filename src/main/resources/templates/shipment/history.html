<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Ιστορικό Δρομολογίων</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .table-dark-custom { background-color: #1e1e1e; }

        /* Μικρές CSS διορθώσεις για να ταιριάζει το DataTables απόλυτα στο Dark Mode μας */
        div.dataTables_wrapper div.dataTables_length select,
        div.dataTables_wrapper div.dataTables_filter input {
            background-color: #2b3035;
            color: #fff;
            border: 1px solid #495057;
            border-radius: 5px;
            padding: 4px 8px;
        }
        div.dataTables_wrapper div.dataTables_length select:focus,
        div.dataTables_wrapper div.dataTables_filter input:focus {
            outline: none;
            border-color: #0dcaf0;
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
        }
        /* Χρώμα στα βελάκια ταξινόμησης */
        table.dataTable thead .sorting:before,
        table.dataTable thead .sorting:after,
        table.dataTable thead .sorting_asc:before,
        table.dataTable thead .sorting_asc:after,
        table.dataTable thead .sorting_desc:before,
        table.dataTable thead .sorting_desc:after {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0 text-secondary">
                <i class="bi bi-archive me-2"></i> Ιστορικό & Κλειστά Δρομολόγια
            </h3>
            <small class="text-muted">Επανεκτύπωση παραστατικών ολοκληρωμένων φορτώσεων</small>
        </div>
        <a th:href="@{/shipments}" class="btn btn-outline-info">
            <i class="bi bi-truck"></i> Ενεργά Δρομολόγια
        </a>
    </div>

    <div class="card bg-transparent border-0 shadow-sm">
        <!-- Προσθέσαμε p-3 για να δώσουμε "ανάσα" στα στοιχεία ελέγχου του DataTables -->
        <div class="card-body p-3 rounded border border-secondary" style="background-color: #1e1e1e;">

            <!-- ΠΡΟΣΟΧΗ: Προσθέσαμε το id="historyTable" και αφαιρέσαμε τον έλεγχο "Αν είναι άδειο" (το χειρίζεται το DataTables) -->
            <table id="historyTable" class="table table-dark table-hover mb-0 align-middle text-center w-100">
                <thead class="text-uppercase small text-muted border-bottom border-secondary">
                <tr>
                    <th>Κωδικός Δρομολογίου</th>
                    <th>Ημ/νια Φόρτωσης</th>
                    <th>Υπεύθυνος</th>
                    <th>Σύνολο Σάκων</th>
                    <th>Ενέργεια</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="shipment : ${closedShipments}">
                    <td class="fw-bold text-info" th:text="${shipment.shipmentCode}"></td>
                    <td th:text="${shipment.loadingDate != null ? shipment.loadingDate : '-'}"></td>
                    <td th:text="${shipment.supervisor != null ? shipment.supervisor : '-'}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${#lists.size(shipment.bags)} + ' Big Bags'"></span>
                    </td>
                    <td>
                        <a th:href="@{'/shipments/' + ${shipment.id} + '/export-final'}" class="btn btn-sm btn-success fw-bold" title="Λήψη Excel">
                            <i class="bi bi-file-earmark-excel"></i> Λήψη
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Βιβλιοθήκες JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- DataTables JS (Core & Bootstrap 5) -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<!-- Ενεργοποίηση του DataTables -->
<script th:inline="none">
    $(document).ready(function() {
        $('#historyTable').DataTable({
            "order": [[0, "desc"]],
            "pageLength": 15,
            "lengthMenu": [10, 15, 25, 50, 100],
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/el.json"
            }
        });
    });
</script>

</body>
</html>
