<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αποθήκη - Big Bags του Batch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card-dark-custom { background-color: #1a1a1a; border: 1px solid #2d2d2d; }
    </style>
</head>
<body>

<!-- ΕΙΣΑΓΩΓΗ NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row g-4">
        <!-- Αριστερή Στήλη: Χειροκίνητη Προσθήκη -->
        <div class="col-md-4">
            <div class="card bg-dark border-secondary shadow-sm mb-3">
                <div class="card-header border-secondary bg-transparent py-3">
                    <h6 class="mb-0 text-info fw-bold">
                        <i class="bi bi-plus-circle me-2"></i>Προσθήκη Big Bag (Χειροκίνητα)
                    </h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/batch/{id}/bigbags/add(id=${batch.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-light fw-bold"><i class="bi bi-speedometer2 me-1"></i>Βάρος (kg)</label>
                            <input type="number" step="0.1" name="weight" class="form-control bg-dark text-light border-secondary" placeholder="π.χ. 1000.0" required>
                        </div>
                        <button type="submit" class="btn btn-success fw-bold w-100">
                            <i class="bi bi-floppy me-1"></i>Αποθήκευση
                        </button>
                    </form>
                </div>
            </div>

            <a th:href="@{/(date=${batch.dailyProduction.productionDate})}" class="btn btn-outline-secondary w-100 fw-bold">
                <i class="bi bi-arrow-left me-1"></i>Επιστροφή στο Dashboard
            </a>
        </div>

        <!-- Δεξιά Στήλη: Λίστα με τα καταχωρημένα Big Bags -->
        <div class="col-md-8">
            <div class="card bg-dark border-secondary shadow-sm">
                <div class="card-header border-secondary bg-transparent py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-info fw-bold">
                        <i class="bi bi-boxes me-2"></i>Καταγεγραμμένα Big Bags
                    </h5>
                    <span class="badge bg-dark border border-secondary text-info fs-6 px-3 py-2">
                        <i class="bi bi-journal-check me-1"></i>Batch: <span th:text="${batch.cookerBatchNumber}"></span>
                        <span class="text-muted mx-1">|</span> Cooker: <span th:text="${batch.cookerId}"></span>
                    </span>
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table table-dark table-hover mb-0 text-center align-middle" style="font-size: 0.9rem;">
                        <thead class="text-uppercase small text-muted border-secondary">
                        <tr>
                            <th>LOT Number (QR String)</th>
                            <th>Βάρος (kg)</th>
                            <th>Κατάσταση</th>
                            <th>Ενέργειες</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="bag : ${bigbags}">
                            <td>
                                <strong th:text="${bag.lotNumber}" class="text-info font-monospace fs-6"></strong>
                            </td>
                            <td class="fw-bold text-light" th:text="${bag.weight} + ' kg'"></td>
                            <td>
                                <span th:if="${bag.status.name() == 'ACTIVE'}" class="badge bg-success fw-bold"><i class="bi bi-check-circle me-1"></i>Ενεργό</span>
                                <span th:if="${bag.status.name() == 'VOIDED'}" class="badge bg-danger fw-bold"><i class="bi bi-x-circle me-1"></i>Ακυρωμένο</span>
                                <span th:if="${bag.status.name() == 'PENDING_EXPORT'}" class="badge bg-warning text-dark fw-bold"><i class="bi bi-clock me-1"></i>Αναμονή</span>
                                <span th:if="${bag.status.name() == 'EXPORTED'}" class="badge bg-secondary fw-bold"><i class="bi bi-box-arrow-up-right me-1"></i>Εξήχθη</span>
                            </td>
                            <td>
                                <!-- ΚΟΥΜΠΙ ΑΚΥΡΩΣΗΣ -->
                                <form th:if="${bag.status.name() == 'ACTIVE'}"
                                      th:action="@{/batch/{batchId}/bigbags/{bagId}/void(batchId=${batch.id}, bagId=${bag.id})}"
                                      method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('Είστε σίγουροι ότι θέλετε να ακυρώσετε αυτόν τον σάκο;');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash3 me-1"></i>Ακύρωση
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bigbags)}">
                            <td colspan="4" class="text-muted py-4">
                                <i class="bi bi-qr-code-scan fs-4 d-block mb-2 text-secondary"></i>
                                Δεν βρέθηκαν Big Bags για αυτό το Batch. Αναμονή σάρωσης από Zebra...
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
