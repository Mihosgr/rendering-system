<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση - Rendering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; }
        .login-card { max-width: 400px; margin: 10vh auto; border-radius: 10px; background-color: #1e1e1e; }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow-lg border-secondary login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-activity text-info" style="font-size: 3.5rem;"></i>
                <h3 class="mt-2 fw-bold text-light">Rendering System</h3>
                <p class="text-secondary small">Βιομηχανικό Σύστημα Ιχνηλασιμότητας</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger bg-transparent border-danger text-danger text-center py-2">
                <i class="bi bi-exclamation-circle me-1"></i> Λάθος στοιχεία σύνδεσης.
            </div>

            <div th:if="${param.logout}" class="alert alert-success bg-transparent border-success text-success text-center py-2">
                Αποσυνδεθήκατε επιτυχώς.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted">Όνομα Χρήστη</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-dark border-secondary text-light" name="username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted">Κωδικός Πρόσβασης</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control bg-dark border-secondary text-light" name="password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-info w-100 py-2 fw-bold text-dark shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Είσοδος
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
