<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4 border-bottom border-secondary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-info" th:href="@{/}"><i class="bi bi-activity"></i> Rendering System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Dashboard -->
                <li class="nav-item">
                    <a class="nav-link fs-5 px-3 text-info" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <!-- Ημερήσια Παραγωγή -->
                <li class="nav-item">
                    <a class="nav-link fs-5 px-3" th:href="@{/}">
                        <i class="bi bi-journal-text me-1"></i> Ημερήσια Παραγωγή
                    </a>
                </li>
                <!-- Αποθήκη -->
                <li class="nav-item">
                    <a class="nav-link fs-5 px-3" th:href="@{/warehouse}">
                        <i class="bi bi-boxes me-1"></i> Αποθήκη
                    </a>
                </li>
                <!-- Δρομολόγια -->
                <li class="nav-item">
                    <a class="nav-link fs-5 px-3 text-success" th:href="@{/shipments}">
                        <i class="bi bi-truck me-1"></i> Δρομολόγια
                    </a>
                </li>
                <!-- Ιστορικό -->
                <li class="nav-item">
                    <a class="nav-link fs-5 px-3 text-secondary" th:href="@{/shipments/history}">
                        <i class="bi bi-archive me-1"></i> Ιστορικό
                    </a>
                </li>
                <!-- Αναφορές -->
                <li class="nav-item">
                    <a class="nav-link fs-5 px-3 text-info" th:href="@{/reports}">
                        <i class="bi bi-file-earmark-bar-graph me-1"></i> Αναφορές
                    </a>
                </li>
                <!-- Χρήστες (Μόνο για Admin) -->
                <li class="nav-item" th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}">
                    <a class="nav-link fs-5 px-3 text-warning" th:href="@{/users}">
                        <i class="bi bi-people me-1"></i> Χρήστες
                    </a>
                </li>
            </ul>

            <!-- Στοιχεία Συνδεδεμένου Χρήστη & Logout -->
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small">
                    <i class="bi bi-person-circle text-info me-1"></i>
                    <strong th:text="${#authentication.name}">User</strong>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm fw-bold">
                        <i class="bi bi-box-arrow-right"></i> Έξοδος
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
