spring.application.name=rendering-system

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/rendering_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mydatabase123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
# Το 'update' δημιουργεί/αλλάζει τους πίνακες αυτόματα βάσει του Java κώδικά μας
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect